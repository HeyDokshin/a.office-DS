<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отчёты ВК</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alfa-bank/tokens.css">
<link rel="stylesheet" href="ds/alfa-bank/components/bundle.css">
<script src="ds/alfa-bank/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>.sc-host:has(> .hd-bar){position:sticky;top:0;z-index:30}body{margin:0;background:var(--bg-base-secondary, #f2f3f5)}</style>
</helmet>
<div style="display: flex; align-items: stretch; min-height: 100vh; background-color: var(--bg-base-secondary, #f2f3f5); font-family: var(--font-system); color: var(--text-primary)">
<dc-import name="SideMenu" active="reports" collapsed="{{collapsed}}" hint-size="260px,900px"></dc-import>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<dc-import name="Header" back="{{yes}}" hint-size="100%,64px"></dc-import>
<dc-import name="ModuleReports" kind="{{kind}}" demo="{{demo}}" hint-size="100%,836px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["unk","cfa","scans"],"default":"unk"},"demo":{"editor":"enum","options":["","result","files"],"default":""},"collapsed":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":956}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, kind: this.props.kind || 'unk', demo: this.props.demo || '', collapsed: !!this.props.collapsed }; }
}
</script>
</body>
</html>
