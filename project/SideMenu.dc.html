<helmet>
<style>
body{margin:0;background:var(--bg-base-alt-primary)}
.sm-cells{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;position:relative;scrollbar-width:thin;scrollbar-color:var(--color-neutral-translucent-300) transparent}
.sm-fade{position:sticky;bottom:0;height:56px;margin-top:-56px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--color-light-neutral-translucent-400-inverted, rgba(222,222,238,.2)));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 100%)}
.sm-cell{padding:4px 12px;box-sizing:border-box;position:relative}
.sm-tip{position:fixed;z-index:1000;transform:translateY(-50%);width:max-content;max-width:240px;box-sizing:border-box;padding:10px 12px;border-radius:12px;background:var(--accent-secondary);color:var(--text-inverted-primary,#fff);font-family:var(--font-system);font-size:13px;line-height:18px;box-shadow:var(--shadow-m-hard,var(--shadow-m));pointer-events:none;animation:sm-tip-in .12s ease}
.sm-tip::before{content:"";position:absolute;left:-4px;top:50%;margin-top:-4px;width:8px;height:8px;background:inherit;transform:rotate(45deg)}
@keyframes sm-tip-in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sm-tip{animation:none}}
.sm-cell .alfa-tooltip,.sm-foot-cell .alfa-tooltip{display:flex;width:100%}
.sm-item{appearance:none;border:0;margin:0;background:transparent;width:100%;min-height:40px;display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:12px;cursor:pointer;font:inherit;font-size:14px;line-height:20px;font-weight:500;color:var(--text-primary);text-align:left;position:relative;box-sizing:border-box;transition:background-color .12s ease}
.sm-item:hover{background:var(--color-neutral-translucent-100)}
.sm-item:focus-visible{outline:2px solid var(--status-info);outline-offset:2px}
.sm-item[aria-current="page"]{background:var(--color-neutral-300)}

/* Вариант 2: меню — плавающая белая карточка */
.sm-nav[data-look="card"] .sm-logo path:first-child{fill:var(--graphic-primary)}
.sm-nav[data-look="card"] .sm-item[aria-current="page"]::before{background:var(--graphic-primary)}
.sm-nav[data-look="card"] .sm-fade{background:linear-gradient(to bottom,transparent,var(--color-light-neutral-translucent-400-inverted, rgba(222,222,238,.2)))}
.sm-nav[data-look="card"] .sm-cell{padding:2px 12px}
.sm-nav[data-look="card"] .sm-item{min-height:48px;padding:4px 8px 4px 0;gap:12px;border-radius:16px}
.sm-nav[data-look="card"] .sm-foot{border-radius:16px}
.sm-nav[data-look="card"] .sm-ico{width:40px;height:40px;border-radius:99px;box-sizing:border-box}
/* Внешняя ссылка: пунктирное кольцо как в Figma — 40×40, обводка 2 px внутрь, neutral-translucent/500.
   Кольцо не тускнеет вместе с иконкой: прозрачность иконки задана цветом, а не opacity */
.sm-nav[data-look="card"] .sm-item[data-ext="true"] .sm-ico{position:relative;opacity:1;color:color-mix(in srgb,var(--graphic-primary) 60%,transparent);transition:color .15s ease}
.sm-nav[data-look="card"] .sm-item[data-ext="true"]:hover .sm-ico{color:var(--graphic-primary);transition-delay:.3s}
.sm-nav[data-look="card"] .sm-item[data-ext="true"] .sm-ico::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:var(--color-neutral-translucent-500, rgba(9,12,37,.28));-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%20viewBox='0%200%2040%2040'%3E%3Ccircle%20cx='20'%20cy='20'%20r='19'%20fill='none'%20stroke='%23000'%20stroke-width='2'%20stroke-dasharray='2.974%202'/%3E%3C/svg%3E") center/40px 40px no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%20viewBox='0%200%2040%2040'%3E%3Ccircle%20cx='20'%20cy='20'%20r='19'%20fill='none'%20stroke='%23000'%20stroke-width='2'%20stroke-dasharray='2.974%202'/%3E%3C/svg%3E") center/40px 40px no-repeat}
.sm-nav[data-look="card"] .sm-ext{display:none}
.sm-nav[data-look="card"] .sm-letter{width:40px;height:40px;border-radius:99px;font-size:12px}
.sm-nav[data-look="card"] .sm-item[aria-current="page"]::before{left:-12px;width:3px;height:40px;border-radius:0 99px 99px 0;background:var(--accent-secondary, var(--graphic-primary))}
.sm-nav[data-look="card"] .sm-div{padding:12px 12px}
.sm-nav[data-look="card"] .sm-foot-wrap{padding:8px !important;gap:8px !important}
.sm-nav[data-look="card"] .sm-foot-cell{padding:0 4px}
.sm-nav[data-look="card"] .alfa-btn{min-height:56px;height:56px;border-radius:99px}
.sm-cta{appearance:none;border:0;margin:0;width:100%;height:48px;padding:0 20px;box-sizing:border-box;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--color-neutral-translucent-100);color:var(--text-primary);font:500 16px/20px var(--font-system);cursor:pointer;transition:background-color .12s ease}
.sm-cta:hover{background:var(--color-neutral-translucent-200)}
.sm-cta:focus-visible{outline:2px solid var(--status-info);outline-offset:2px}
.sm-cta--primary{background:var(--graphic-primary);color:var(--text-primary-inverted,#fff)}
.sm-cta--primary:hover{background:var(--graphic-primary);opacity:.88}
.sm-nav[data-look="card"] .sm-cta{height:56px;border-radius:99px}

.sm-nav[data-look="card"] .alfa-iconbtn{border-radius:99px}
/* Вариант 2, свёрнуто: колонка 64px, иконки 40px по центру, активный пункт — круг */
.sm-nav[data-look="card"][data-collapsed="true"] .sm-item{width:40px;min-height:40px;height:40px;padding:0;border-radius:99px;justify-content:center}
.sm-nav[data-look="card"][data-collapsed="true"] .sm-ico,.sm-nav[data-look="card"][data-collapsed="true"] .sm-letter{border-radius:99px}
.sm-nav[data-look="card"][data-collapsed="true"] .sm-mini-btn{width:40px;height:40px;border-radius:99px}
.sm-nav[data-look="card"][data-collapsed="true"] .sm-mini-wrap{padding:8px 0 !important}
/* свёрнуто: строки той же высоты, что в развёрнутом (52px), чтобы иконки не прыгали при сворачивании */
.sm-nav[data-look="card"][data-collapsed="true"] .sm-cell{padding:6px 12px}
/* разделитель вместо заголовка «Закреплённые ссылки» — той же высоты, 40px */
.sm-nav[data-look="card"][data-collapsed="true"] .sm-div--links{padding:20px 12px 19px}
/* Ручка изменения ширины: тянуть — мини (64) или полное (240–360), двойной клик — переключить */
.sm-resize{position:absolute;top:0;right:0;bottom:0;width:10px;z-index:6;cursor:col-resize;touch-action:none;outline:none}
.sm-resize::after{content:"";position:absolute;top:50%;right:3px;width:4px;height:48px;transform:translateY(-50%);border-radius:99px;background:transparent;transition:background-color .12s ease,height .12s ease}
.sm-resize:hover::after,.sm-resize:focus-visible::after{background:var(--color-neutral-translucent-500, var(--graphic-secondary))}
.sm-nav[data-dragging="true"] .sm-resize::after{background:var(--status-info);height:64px}
.sm-gtitle{padding:16px 12px 8px 16px;font-size:12px;line-height:16px;letter-spacing:1.25px;text-transform:uppercase;color:var(--text-secondary);white-space:nowrap}
.sm-ext{display:inline-flex;color:var(--graphic-secondary);opacity:.6;flex:0 0 auto;margin-left:auto}
.sm-tri{transition:transform .15s ease}
.sm-tri[data-open="false"]{transform:rotate(180deg)}
.sm-sub .sm-item{}
.sm-nav:not([data-look="card"])[data-collapsed="true"] .sm-item{width:40px;min-height:40px;height:40px;padding:0;justify-content:center;border-radius:99px}
.sm-item[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:2px;height:40px;border-radius:0 2px 2px 0;background:var(--accent-primary)}
.sm-ico{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--graphic-primary);opacity:.6;flex:0 0 auto;transition:opacity .12s ease}
.sm-item:hover .sm-ico,.sm-item[aria-current="page"] .sm-ico{opacity:1}
.sm-label{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-tri{display:inline-flex;color:var(--graphic-secondary);flex:0 0 auto}
/* «Вариант 1» (flat): цветные ссылки — квадраты со скруглёнными углами; «Вариант 2» (card) — круги */
.sm-letter{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:16px;font-weight:700;flex:0 0 auto}
.sm-div{padding:12px 16px}
.sm-div::after{content:"";display:block;height:1px;background:var(--color-neutral-translucent-300)}
.sm-group{appearance:none;border:0;margin:0;background:transparent;width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px 16px;font:inherit;font-size:12px;line-height:16px;letter-spacing:1.25px;text-transform:uppercase;color:var(--text-secondary);cursor:pointer;box-sizing:border-box}
.sm-foot{appearance:none;border:0;margin:0;background:transparent;width:100%;min-width:0;display:flex;align-items:center;gap:4px;padding:4px 0 4px 4px;box-sizing:border-box;border-radius:12px;font:inherit;font-size:14px;line-height:20px;font-weight:500;color:var(--text-secondary);cursor:pointer}
.sm-foot .sm-fi{display:inline-flex;color:var(--graphic-primary);opacity:.6}
.sm-foot:hover{color:var(--text-primary)}
.sm-foot:hover .sm-fi{opacity:1}
.sm-mini-btn{appearance:none;border:0;margin:0;background:transparent;width:40px;height:32px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--graphic-primary)}
.sm-mini-btn span{display:inline-flex;opacity:.6}
.sm-mini-btn:hover{background:var(--color-neutral-translucent-100)}
.sm-mini-btn:hover span{opacity:1}
.sm-foot:focus-visible,.sm-group:focus-visible,.sm-mini-btn:focus-visible{outline:2px solid var(--status-info);outline-offset:2px}

/* Нижняя подложка меню с кнопкой — прозрачный материал (как шапка и закреплённые части таблиц) */
/* Нижняя плашка лежит ПОВЕРХ списка: пункты меню уезжают под прозрачную подложку с блюром, сверху — прогрессивный блюр */
.sm-nav{--sm-fh:114px}
.sm-nav[data-collapsed="true"]{--sm-fh:142px}
.sm-nav[data-look="card"]{--sm-fh:112px}
.sm-nav[data-look="card"][data-collapsed="true"]{--sm-fh:146px}
/* в конце списка последняя ссылка выходит из-под фейда: запас = высота плашки + фейд 40 px */
.sm-cells{padding-bottom:calc(var(--sm-fh) + 40px)}
/* полоса прокрутки списка не видна; в развёрнутом меню тонкая полоса появляется только при наведении */
.sm-cells{scrollbar-width:none}
.sm-cells::-webkit-scrollbar{width:0;height:0}
.sm-nav:not([data-collapsed="true"]) .sm-cells:hover{scrollbar-width:thin}
.sm-nav:not([data-collapsed="true"]) .sm-cells:hover::-webkit-scrollbar{width:6px}
.sm-nav:not([data-collapsed="true"]) .sm-cells:hover::-webkit-scrollbar-thumb{background:var(--color-neutral-translucent-300);border-radius:99px}
.sm-fade{display:none}
.sm-foot-wrap,.sm-mini-wrap{position:absolute !important;left:0;right:0;bottom:0;box-sizing:border-box;z-index:2;background:transparent;isolation:isolate}
/* один общий слой: подложка + блюр, вверху плавно сходит на нет */
.sm-foot-wrap::before,.sm-mini-wrap::before{content:"";position:absolute;left:0;right:0;bottom:0;top:-40px;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,transparent 0,var(--color-light-neutral-translucent-400-inverted, rgba(222,222,238,.2)) 40px);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 48px);mask-image:linear-gradient(to bottom,transparent 0,#000 48px)}

/* Меню «Создать» */
.sm-cwrap{position:relative}
.sm-cmenu{position:absolute;left:0;bottom:calc(100% + 8px);z-index:60;min-width:240px;padding:8px 0;border-radius:16px;background:var(--bg-base-primary,#fff);box-shadow:0 12px 32px rgba(0,0,0,.16),0 0 0 1px rgba(15,25,55,.06);display:flex;flex-direction:column;animation:sm-cm-in .16s ease}
.sm-cwrap--mini .sm-cmenu{left:4px}
@keyframes sm-cm-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sm-cmenu-h{padding:8px 16px 6px;font:500 11px/16px var(--font-system);letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary)}
.sm-cmenu button{appearance:none;border:0;margin:0;padding:10px 16px;background:transparent;text-align:left;font:400 14px/20px var(--font-system);color:var(--text-primary);cursor:pointer}
.sm-cmenu button:hover{background:var(--color-neutral-translucent-100)}
.sm-cmenu button:focus-visible{outline:2px solid var(--status-info);outline-offset:-2px}
.sm-cscrim{position:fixed;inset:0;z-index:59;border:0;margin:0;padding:0;background:transparent;cursor:default}
/* === HOVER-DELAY (сгенерировано ccw/hover.py): пауза 0,3 с перед реакцией на наведение === */
.sm-item,
.sm-nav[data-look="card"] .sm-item[data-ext="true"] .sm-ico,
.sm-cta,
.sm-cta--primary,
.sm-resize::after,
.sm-item .sm-ico,
.sm-foot,
.sm-foot .sm-fi,
.sm-mini-btn,
.sm-mini-btn span,
.sm-cmenu button{transition:background-color .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease,opacity .15s ease,filter .15s ease,text-decoration-color .15s ease,transform .15s ease}
.sm-item:hover,
.sm-nav[data-look="card"] .sm-item[data-ext="true"]:hover .sm-ico,
.sm-cta:hover,
.sm-cta--primary:hover,
.sm-resize:hover::after,
.sm-item:hover .sm-ico,
.sm-foot:hover,
.sm-foot:hover .sm-fi,
.sm-mini-btn:hover,
.sm-mini-btn:hover span,
.sm-cmenu button:hover{transition-delay:.3s}
.sm-item:hover:active,
.sm-nav[data-look="card"] .sm-item[data-ext="true"]:hover .sm-ico:active,
.sm-cta:hover:active,
.sm-cta--primary:hover:active,
.sm-item:hover .sm-ico:active,
.sm-foot:hover:active,
.sm-foot:hover .sm-fi:active,
.sm-mini-btn:hover:active,
.sm-mini-btn:hover span:active,
.sm-cmenu button:hover:active{transition-delay:0s}
/* === /HOVER-DELAY === */
</style>
</helmet>
<nav class="sm-nav" data-look="{{look}}" data-collapsed="{{collapsedAttr}}" data-dragging="{{dragging}}" aria-label="Основное меню" style="{{rootStyle}}">
<div style="display: flex; align-items: center; gap: 8px; padding: 12px; box-sizing: border-box; flex: 0 0 auto; padding-top: 8px; padding-right: 8px; padding-bottom: 8px; padding-left: 8px">
<svg class="sm-logo" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="{{brand}}" style="flex: 0 0 auto; border-radius: 999px; width: 48px; height: 48px"><path fill="var(--accent-primary)" d="M.65 10.263C1.378 5.18 5.18 1.378 10.263.65 12.858.28 16.103 0 20 0c3.896 0 7.142.279 9.737.65 5.084.728 8.885 4.53 9.613 9.613.371 2.595.65 5.84.65 9.737 0 3.896-.279 7.142-.65 9.737-.728 5.084-4.53 8.885-9.613 9.613-2.595.371-5.84.65-9.737.65-3.896 0-7.142-.279-9.737-.65-5.084-.728-8.885-4.53-9.613-9.613C.28 27.142 0 23.897 0 20c0-3.896.279-7.142.65-9.737z" stroke-linecap="round"></path><path transform="translate(8 8)" fill="#fff" fill-rule="evenodd" clip-rule="evenodd" d="M12.103 2c-1.485 0-1.946.879-2.342 2l-4.08 11.557h2.706l.942-2.747h5.205l.874 2.747h2.877L14.397 4c-.376-1.117-.81-2-2.294-2zm-.071 3.01h-.069l-1.85 5.479h3.665L12.032 5.01zM18.593 22H5.407v-2.73h13.186V22z" stroke-linecap="round"></path></svg>
<sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span style="font-size: 18px; line-height: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{brand}}</span></sc-if>

<div class="sm-cells">
<sc-for list="{{main}}" as="it" hint-placeholder-count="4">

<button class="sm-item" type="button" data-ext="{{it.extAttr}}" aria-current="{{it.current}}" aria-label="{{it.label}}" onClick="{{it.go}}" onMouseEnter="{{it.tipIn}}" onMouseLeave="{{tipOut}}" onFocus="{{it.tipIn}}" onBlur="{{tipOut}}">

<sc-if value="{{it.i_book}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" focusable="false" fill="currentColor" width="24" height="24" viewBox="0 0 24 24"><path d="M8 4c1.636 0 3.088.786 4 2a4.992 4.992 0 014-2h6v14h-6a2.998 2.998 0 00-2.826 2h-2.348A2.999 2.999 0 008 18H2V4h6zM4 16h4c1.126 0 2.164.372 3 1V9a3 3 0 00-3-3H4v10zM16 6a3 3 0 00-3 3v8c.836-.628 1.874-1 3-1h4V6h-4z"></path></svg></sc-if>

    const nav = e.currentTarget && e.currentTarget.closest('nav');
    const startW = nav ? nav.getBoundingClientRect().width : MIN;
    const x0 = e.clientX;
    let moved = false;
    const move = (ev) => {
      const dx = ev.clientX - x0;
      if (!moved && Math.abs(dx) < 3) return;
      moved = true;
      this.setState({ dragW: startW + dx, tip: null });
    };
    const stop = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      this._stopDrag = null;
    };
    const up = () => {
      stop();
      const w = (this.state || {}).dragW;
      if (!moved || w == null) { this.setState({ dragW: null }); return; }
      if (w < MID) this.commit(true, null);
      else this.commit(false, w);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    this._stopDrag = stop;
  }
  tipFor(getLabel) {
    return (e) => {
      const st = this.state || {};
      const collapsed = st.dragW != null ? false : (st.collapsed != null ? st.collapsed : !!this.props.collapsed);
      if (!collapsed) return;
      const el = e && e.currentTarget;
      if (!el || !el.getBoundingClientRect) return;
      const r = el.getBoundingClientRect();
      const nav = el.closest('nav');
      const left = (nav ? nav.getBoundingClientRect().right : r.right) + 8;
      const top = r.top + r.height / 2;
      const label = typeof getLabel === 'function' ? getLabel() : getLabel;
      clearTimeout(this._tipT);
      this._tipT = setTimeout(() => this.setState({ tip: { label: label, left: left, top: top } }), 300);
    };
  }
  hideTip() { clearTimeout(this._tipT); if ((this.state || {}).tip) this.setState({ tip: null }); }
  renderVals() {
    const s = this.state || {};
    const baseCollapsed = s.collapsed != null ? s.collapsed : !!this.props.collapsed;
    // во время перетаскивания состояние берём из текущей ширины
    const collapsed = s.dragW != null ? s.dragW < MID : baseCollapsed;
    const expanded = !collapsed;
    // active='none' — ни один пункт не подсвечен (например, «Поиск по модулю» открыт из шапки)
    const active = s.active || this.props.active || 'queue';
    const admin = this.props.admin !== false;
    const action = this.props.action || 'create';
    const working = s.working != null ? s.working : action === 'finish';
    const go = (key) => () => { this.setState({ active: key }); if (this.props.onNavigate) this.props.onNavigate(key); };
    const vkOpen = s.vkOpen !== false;
    const vkOpenNow = s.vkOpen !== false;
    const defs = [
      ['queue', 'Очередь задач'], ['clients', 'Клиенты'], ['book', 'Справочник'], ['admin', 'Администрирование'],
      ['cap', 'Траектория развития', 'ext'], ['kb', 'База знаний', 'ext'],
      
    ].filter((d) => (admin || d[0] !== 'admin') && (vkOpenNow || String(d[2] || '').indexOf('sub') === -1));
    const lastTop = admin ? 'admin' : 'book';
    const icons = ['queue', 'clients', 'book', 'admin', 'cap', 'kb', 'vk', 'search', 'reports', 'money', 'archive', 'sign'];
    const main = defs.map((d) => {
      const flags = String(d[2] || '');
      const it = {
        label: d[1],
        tipIn: this.tipFor(d[1]),
        current: active === d[0] ? 'page' : undefined,
        go: d[0] === 'vk' ? () => this.setState({ vkOpen: !vkOpenNow }) : go(d[0]),
        dividerAfter: d[0] === lastTop || (d[0] === 'kb' && !collapsed),
        showTri: expanded && flags.indexOf('tri') !== -1,
        triOpen: vkOpenNow ? 'true' : 'false',
        showExt: expanded && flags.indexOf('ext') !== -1,
        extAttr: flags.indexOf('ext') !== -1 ? 'true' : 'false'
      };
      icons.forEach((k) => { it['i_' + k] = false; });
      it['i_' + d[0]] = true;
      return it;
    });
    // цветные ссылки: фон — decorative-muted-alt, буквы — decorative
    const badge = (c) => 'background: var(--decorative-muted-alt-' + c + '); color: var(--decorative-' + c + ')';
    // 10 цветных ссылок модуля — у каждой свой токен decorative-muted-alt (админка настроит состав позже)
    const links = [
      ['cb', 'ЦБ', 'ЦБ РФ', badge('pistachio')],
      ['eg', 'ЕГ', 'ЕГРЮЛ', badge('indigo')],
      ['ko', 'КО', 'Консультант +', badge('blue')],
      ['fns', 'ФН', 'ФНС России', badge('orange')],
      ['rfm', 'РФ', 'Росфинмониторинг', badge('teal')],
      ['gar', 'ГА', 'Гарант', badge('red')],
      ['fed', 'ФР', 'Федресурс', badge('cyan')],
      ['fts', 'ФТ', 'ФТС России', badge('jungle')],
      ['spk', 'СП', 'СПАРК', badge('fuchsia')],
      ['kf', 'КФ', 'Контур.Фокус', badge('magenta')]
    ].map((l) => ({ short: l[1], label: l[2], style: l[3], current: active === l[0] ? 'page' : undefined, go: go(l[0]), tipIn: this.tipFor(l[2]) }));
    const look = s.look || this.props.look || 'flat';
    const card = look === 'card';
    const fullW = this.fullWidth(card);
    const dragging = s.dragW != null;
    const width = collapsed ? MINI : (dragging ? clampW(s.dragW) : fullW);
    return {
      yes: true,
      fullWidth: true,
      n48: 48,
      expanded: expanded,
      collapsed: collapsed,
      tip: expanded ? false : undefined,
      look: look,
      collapsedAttr: collapsed ? 'true' : 'false',
      brand: card ? 'Альфа–Офис' : 'Smart BackOffice',
      rootStyle: 'width: ' + width + 'px; min-width: ' + width + 'px; position: sticky; z-index: 40; box-sizing: border-box; display: flex; flex-direction: column; font-family: var(--font-system); color: var(--text-primary); ' + (dragging ? 'transition: none; ' : 'transition: width .15s ease, min-width .15s ease; ') + (card ? 'top: 8px; margin: 8px 0 8px 8px; height: calc(100vh - 16px); background: var(--bg-base-primary); border-radius: 28px; box-shadow: 0 0 1px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04); overflow: hidden' : 'top: 0; height: 100vh; background: transparent'),
      main: main,
      links: links,
      vkOpen: vkOpen,
      vkClosed: !vkOpen,
      showLinks: true,
      toggleVk: () => this.setState({ vkOpen: !vkOpen }),
      dir2Open: !!s.dir2Open,
      dir2Closed: !s.dir2Open,
      toggleDir2: () => this.setState({ dir2Open: !s.dir2Open }),
      krStyle: badge('blue'),
      krCurrent: active === 'kr' ? 'page' : undefined,
      goKr: go('kr'),
      toggle: () => this.commit(!collapsed, null),
      dragging: dragging ? 'true' : 'false',
      widthNow: width,
      widthText: collapsed ? 'Мини, 64 пикселя' : 'Полное, ' + width + ' пикселей',
      startResize: (e) => this.startResize(e),
      resizeKey: (e) => {
        const k = e && e.key;
        if (k === 'Enter' || k === ' ') { e.preventDefault(); this.commit(!collapsed, null); return; }
        if (k !== 'ArrowLeft' && k !== 'ArrowRight') return;
        e.preventDefault();
        const step = e.shiftKey ? 40 : 16;
        if (k === 'ArrowRight') { if (collapsed) this.commit(false, fullW); else this.commit(false, fullW + step); }
        else { if (collapsed) return; if (fullW - step < MIN) this.commit(true, null); else this.commit(false, fullW - step); }
      },
      toggleFromTip: () => { clearTimeout(this._tipT); this.setState({ collapsed: !collapsed, tip: null }); },
      tipOut: () => this.hideTip(),
      tipHelp: this.tipFor('Помощь'),
      tipExpand: this.tipFor('Раскрыть меню'),
      tipCreate: this.tipFor('Создать'),
      tipWork: this.tipFor(() => ((this.state || {}).working != null ? this.state.working : (this.props.action || 'create') === 'finish') ? 'Завершить работу' : 'Начать работу'),
      tipShow: collapsed && !!s.tip,
      tipLabel: s.tip ? s.tip.label : '',
      tipStyle: s.tip ? 'left: ' + Math.round(s.tip.left) + 'px; top: ' + Math.round(s.tip.top) + 'px' : '',
      isCreate: action === 'create',
      createOpen: !!s.createOpen, createStr: s.createOpen ? 'true' : 'false',
      toggleCreate: () => this.setState({ createOpen: !s.createOpen }), closeCreate: () => this.setState({ createOpen: false }),
      createItems: ['Контракт', 'СВО', 'СПД', 'Исходящее письмо', 'Исходящее письмо с ЭЦП', 'Запрос клиента'].map((l) => ({ label: l, pick: () => { this.setState({ createOpen: false }); if (this.props.onCreate) this.props.onCreate(l); else { try { window.dispatchEvent(new CustomEvent('sbo:create', { detail: { kind: l } })); } catch (e) {} } } })),
      isWork: action !== 'create',
      working: working,
      notWorking: !working,
      workLabel: working ? 'Завершить работу' : 'Начать работу',
      toggleWork: () => this.setState({ working: !working })
    };
  }
}
</script>
