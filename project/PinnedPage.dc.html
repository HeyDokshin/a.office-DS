<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Закреплённые сотрудники</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alfa-bank/tokens.css">
<link rel="stylesheet" href="ds/alfa-bank/components/bundle.css">
<script src="ds/alfa-bank/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>.sc-host:has(> .hd-bar){position:sticky;top:0;z-index:30}body{margin:0;background:var(--bg-base-secondary, #f2f3f5)}</style>
</helmet>
<div style="display: flex; align-items: stretch; min-height: 100vh; background-color: var(--bg-base-secondary, #f2f3f5); font-family: var(--font-system); color: var(--text-primary)">
<dc-import name="SideMenu" active="clients" collapsed="{{yes}}" hint-size="64px,900px"></dc-import>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<dc-import name="Header" back="{{yes}}" back-label="К клиентам" pin-demo="{{sheet}}" hint-size="100%,64px"></dc-import>
<dc-import name="PinnedEmployees" demo="{{demo}}" hint-size="100%,836px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"demo":{"editor":"enum","options":["","load-err","part-err","pending"],"default":""},"sheet":{"editor":"enum","options":["","replace","replace-open","replace-err","replace-busy","replace-done","replace-fail","group-replace","add","add-list-err","remove","remove-done","group-remove"],"default":""},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, demo: this.props.demo || '', sheet: this.props.sheet || '' }; }
}
</script>
</body>
</html>
